<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="index.php" method="post" enctype="multipart/form-data">

         <label for="Username">Username:</label>
         <input type="text" id="Username" placeholder="Enter your name" minlength="7" maxlength="20" required ><br>
         
         <labbel for="Password">Password:</labbel>
         <input type="password" id="Password" placeholder="Enter your name" minlength="7" maxlength="20" required><br>

        <label for="Email" >Email:</label>
        <input type="email" id="Email" placeholder="Enter your Email" required ><br>

        <label for="Phone">Phone:</label>
        <input type="tel" placeholder="123456789" minlength="10" maxlength="10" required><br>

        <label for="Bday">Birthdate  :</label>
        <input type="date" id="Bday"><br>

        <label>Title :</label>
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" value="Mr." name="title">
        <label for="Mrs">Mrs.</label>
        <input type="radio" id="Mrs" value="Mrs.">
        <label for="PhD">PhD.</label>
        <input type="radio" id="Phd" value="PhD."><br>

        <label>Payment:</label>
        <select>
            <option></option>
            <option>Visa</option>
            <option>Debit Card</option>
            <option>Credit Card</option>
            <option>Gift Card</option>
        </select><br>
        <lable for="subscribe">Subscribe:</lable>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">Comment:</label>
        <textarea id="comment"></textarea><br>

        <label for="file">File:</label>
        <input type="file" id="file" ><br>
         <br><br>
         <input type="submit" style="background-color: rgb(255, 251, 251); border-radius: 30px;" >
         <input type="reset"style="background-color: rgb(255, 251, 251); border-radius: 30px;">
    </form>
    
</body>
</html>
